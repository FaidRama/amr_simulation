scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: filter_sasis_box
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: "base_link" # Menggunakan pusat robot sebagai acuan potong
        min_x: -0.285 # Jarak aman ke belakang
        max_x: 0.285 # Jarak aman ke depan
        min_y: -0.285 # Jarak aman ke kanan
        max_y: 0.285 # Jarak aman ke kiri
        min_z: -0.50 # Batas bawah tanah
        max_z: 0.50 # Batas atas kepala robot

    filter2:
      name: filter_sasis_radius
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.32
        upper_threshold: 12.0
        lower_replacement_value: .NaN
