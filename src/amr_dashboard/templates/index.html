<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>AMR Delivery Dashboard</title>
    <meta name="description" content="Dashboard kontrol AMR Delivery Robot">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- ============ TOP BAR (selalu visible) ============ -->
    <header id="topbar">
        <button id="btn-back" class="topbar-btn hidden" onclick="navigateTo('home')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="topbar-title">
            <div class="topbar-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
            </div>
            <span id="page-title">AMR Dashboard</span>
        </div>
        <div id="connection-badge" class="badge badge-offline">
            <span class="badge-dot"></span>
            <span class="badge-text">Offline</span>
        </div>
    </header>

    <!-- ============ MAIN CONTENT AREA ============ -->
    <main id="app-content">
        <!-- Konten di-render oleh JavaScript -->
    </main>

    <!-- ============ TOAST NOTIFICATION ============ -->
    <div id="toast-container"></div>

    <!-- ============ MODAL DIALOG ============ -->
    <div id="modal-overlay" class="hidden">
        <div id="modal-box">
            <h3 id="modal-title"></h3>
            <div id="modal-body"></div>
            <div id="modal-actions"></div>
        </div>
    </div>

    <!-- ============ JAVASCRIPT ============ -->
    <script src="/static/js/app.js"></script>
    <script src="/static/js/map.js"></script>
    <script src="/static/js/joystick.js"></script>
    <script src="/static/js/monitoring.js"></script>
</body>
</html>
