<!DOCTYPE html>
<html lang="id" data-theme="nordic-slate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>AMR-01 // Control Studio</title>
    <meta name="description" content="Autonomous Mobile Robot Telemetry & Dispatch Studio">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        (function() {
            const saved = localStorage.getItem('amr_theme') || 'nordic-slate';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
</head>
<body>
    <!-- ============ STUDIO SIDEBAR (Desktop) ============ -->
    <aside id="app-sidebar">
        <div class="sidebar-brand" onclick="navigateTo('home')" title="AMR Control Studio">
            <div class="sidebar-brand-mark">R2</div>
            <div class="sidebar-brand-text">
                <span class="brand-name">AMR-01</span>
                <span class="brand-sub">STUDIO // ROS2</span>
            </div>
        </div>

        <div class="sidebar-group-label">WORKSPACE</div>
        <nav class="sidebar-menu">
            <button class="nav-item" data-page="home" onclick="navigateTo('home')" title="Mission Overview">
                <span class="nav-icon" id="s-icon-home"></span>
                <span class="nav-label">Overview</span>
                <span class="nav-kbd">01</span>
            </button>
            <button class="nav-item" data-page="monitoring" onclick="navigateTo('monitoring')" title="Cockpit Telemetry">
                <span class="nav-icon" id="s-icon-monitoring"></span>
                <span class="nav-label">Cockpit</span>
                <span class="nav-kbd">02</span>
            </button>
            <button class="nav-item" data-page="delivery" onclick="navigateTo('delivery')" title="Delivery Dispatch">
                <span class="nav-icon" id="s-icon-delivery"></span>
                <span class="nav-label">Dispatch</span>
                <span class="nav-kbd">03</span>
            </button>

            <div class="sidebar-group-label sidebar-group-spaced">OPERATIONS</div>
            <button class="nav-item" data-page="camera" onclick="navigateTo('camera')" title="Optical Camera Stream">
                <span class="nav-icon" id="s-icon-camera"></span>
                <span class="nav-label">Optical Cam</span>
                <span class="nav-kbd">04</span>
            </button>
            <button class="nav-item" data-page="joystick" onclick="navigateTo('joystick')" title="Manual Teleop">
                <span class="nav-icon" id="s-icon-joystick"></span>
                <span class="nav-label">Teleop</span>
                <span class="nav-kbd">05</span>
            </button>
            <button class="nav-item" data-page="history" onclick="navigateTo('history')" title="Mission Logs">
                <span class="nav-icon" id="s-icon-history"></span>
                <span class="nav-label">Logs</span>
                <span class="nav-kbd">06</span>
            </button>
            <button class="nav-item" data-page="settings" onclick="navigateTo('settings')" title="System Config">
                <span class="nav-icon" id="s-icon-settings"></span>
                <span class="nav-label">Config</span>
                <span class="nav-kbd">07</span>
            </button>
        </nav>

        <div class="sidebar-bottom">
            <div class="sidebar-sys-card">
                <div class="sys-card-row">
                    <span class="sys-card-key">NODE</span>
                    <span class="sys-card-val" id="sidebar-node-state">NAV2_IDLE</span>
                </div>
                <div class="sys-card-row">
                    <span class="sys-card-key">AI SAFETY</span>
                    <span class="sys-card-val text-emerald" id="sidebar-human-state">CLEAR</span>
                </div>
            </div>
            <button class="sidebar-estop-btn" onclick="emergencyStop()" title="Emergency Stop">
                <span class="estop-dot"></span>
                <span>EMERGENCY STOP</span>
            </button>
        </div>
    </aside>

    <!-- ============ PRECISION TELEMETRY TOPBAR ============ -->
    <header id="topbar">
        <button id="btn-back" class="topbar-btn hidden" onclick="navigateTo('home')" title="Kembali ke Overview">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>

        <div class="topbar-title">
            <span class="topbar-breadcrumb">AMR-01</span>
            <span class="topbar-sep">/</span>
            <div class="topbar-text-group">
                <span id="page-title">Mission Overview</span>
                <span class="topbar-subtext">ROS2 Autonomous Delivery Unit</span>
            </div>
        </div>

        <!-- Live Pose Telemetry Strip (Desktop) -->
        <div class="topbar-telemetry-strip">
            <div class="tele-pill">
                <span class="tele-key">X</span>
                <span class="tele-val" id="topbar-pose-x">0.00m</span>
            </div>
            <div class="tele-pill">
                <span class="tele-key">Y</span>
                <span class="tele-val" id="topbar-pose-y">0.00m</span>
            </div>
            <div class="tele-pill">
                <span class="tele-key">YAW</span>
                <span class="tele-val tele-accent" id="topbar-pose-yaw">0.0°</span>
            </div>
        </div>

        <div class="topbar-right">
            <button class="topbar-theme-btn" onclick="cycleTheme()" title="Ganti Tema Warna Cepat (Atau buka Config)">
                <span class="theme-dot-indicator"></span>
                <span id="topbar-theme-label">Nordic Slate</span>
            </button>
            <div id="live-clock" class="topbar-clock">--:--:--</div>
            <div id="connection-badge" class="badge badge-offline">
                <span class="badge-dot"></span>
                <span class="badge-text">Offline</span>
            </div>
            <button class="topbar-estop-btn" onclick="emergencyStop()" title="Emergency Stop">E-STOP</button>
        </div>
    </header>

    <!-- ============ GLOBAL MISSION FLOATING BANNER ============ -->
    <div id="global-mission-banner" class="hidden" onclick="onBannerClick()">
        <div class="banner-content">
            <span class="banner-icon" id="banner-icon"></span>
            <div class="banner-text-wrap">
                <span class="banner-title" id="banner-title"></span>
                <span class="banner-subtitle" id="banner-subtitle"></span>
            </div>
        </div>
        <button class="banner-btn" id="banner-btn" onclick="event.stopPropagation(); onBannerBtnClick()">Konfirmasi</button>
    </div>

    <!-- ============ MAIN CONTENT AREA ============ -->
    <main id="app-content">
        <!-- Konten di-render oleh JavaScript -->
    </main>

    <!-- ============ TOAST NOTIFICATION ============ -->
    <div id="toast-container"></div>

    <!-- ============ MODAL DIALOG ============ -->
    <div id="modal-overlay" class="hidden" onclick="closeModal(event)">
        <div id="modal-box">
            <div class="modal-header-line">
                <span class="modal-tag">SYS // PROMPT</span>
                <h3 id="modal-title"></h3>
            </div>
            <div id="modal-body"></div>
            <div id="modal-actions"></div>
        </div>
    </div>

    <!-- ============ ARRIVAL CONFIRMATION MODAL ============ -->
    <div id="arrival-modal-overlay" class="hidden" onclick="closeArrivalModalOnBackdrop(event)">
        <div id="arrival-modal-box">
            <div class="arrival-modal-icon" id="arrival-modal-icon"></div>
            <h2 class="arrival-modal-title" id="arrival-modal-title"></h2>
            <p class="arrival-modal-desc" id="arrival-modal-desc"></p>
            <div class="arrival-modal-actions" id="arrival-modal-actions"></div>
        </div>
    </div>

    <!-- ============ MOBILE BOTTOM NAV (Mobile Screens) ============ -->
    <nav id="mobile-nav">
        <button class="mobile-nav-item" data-page="home" onclick="navigateTo('home')">
            <span class="mobile-nav-icon" id="m-icon-home"></span>
            <span>Overview</span>
        </button>
        <button class="mobile-nav-item" data-page="monitoring" onclick="navigateTo('monitoring')">
            <span class="mobile-nav-icon" id="m-icon-monitoring"></span>
            <span>Cockpit</span>
        </button>
        <button class="mobile-nav-item" data-page="delivery" onclick="navigateTo('delivery')">
            <span class="mobile-nav-icon" id="m-icon-delivery"></span>
            <span>Dispatch</span>
        </button>
        <button class="mobile-nav-item" data-page="camera" onclick="navigateTo('camera')">
            <span class="mobile-nav-icon" id="m-icon-camera"></span>
            <span>Kamera</span>
        </button>
        <button class="mobile-nav-item" data-page="joystick" onclick="navigateTo('joystick')">
            <span class="mobile-nav-icon" id="m-icon-joystick"></span>
            <span>Teleop</span>
        </button>
    </nav>

    <!-- ============ JAVASCRIPT ============ -->
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/map.js"></script>
    <script src="/static/js/joystick.js"></script>
    <script src="/static/js/monitoring.js"></script>
</body>
</html>
